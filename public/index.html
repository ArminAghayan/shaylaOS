<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon/favicon.svg" />
    <link rel="shortcut icon" href="%PUBLIC_URL%/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/favicon/site.webmanifest" />

    <meta name="msapplication-TileColor" content="#a5f3fc" />
    <meta name="theme-color" content="#a5f3fc" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="ShaylaOS for my wife"
    />
    <title>ShaylaOS</title>
    <link
      href="https://unpkg.com/basscss@8.0.2/css/basscss.min.css"
      rel="stylesheet"
    />
    <!-- Custom Pacman styling -->
    <link href="%PUBLIC_URL%/css/custom-pacman.css" rel="stylesheet" />
    <style>
      @font-face {
        font-family: "Windows 95";
        src: url("%PUBLIC_URL%/fonts/w-95-sans-serif.woff2") format("woff2"),
          url("%PUBLIC_URL%/fonts/w-95-sans-serif.woff") format("woff");
        font-weight: normal;
        font-style: normal;
      }
      html,
      body,
      #root {
        height: 100%;
      }
      html,
      body {
        max-width: 1400px;
        min-width: 768px;
        overflow: hidden;
        overflow-x: auto;
        margin: auto !important;
      }
      body {
        background-color: #000;
        position: relative;
      }
      body:after {
        position: fixed;
        content: "";
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        background: linear-gradient(transparent 50%, #fff 50%),
          linear-gradient(90deg, #f00, #f00 33%, #0f0 33%, #0f0 66%, #00f 66%);
        background-size: 100% 3px, 3px 3px;
        pointer-events: none;
        opacity: 0.06;
        z-index: 99999;
      }
      body,
      h1,
      h2,
      h3,
      h4,
      h5,
      h6,
      p,
      a,
      span,
      li,
      th,
      td,
      button,
      input,
      label,
      th,
      td,
      pre {
        font-family: "Windows 95", sans-serif !important;
      }
      p,
      a,
      span,
      li,
      button,
      input,
      label,
      th,
      td,
      pre {
        font-size: 10px !important;
      }
      p {
        line-height: 2 !important;
      }
      #root {
        position: relative;
        background-color: #a5f3fc;
      }
      main {
        height: calc(100% - 47px);
        padding-bottom: 47px;
      }
      html,
      body,
      body #root * {
        cursor: url("%PUBLIC_URL%/assets/cursor.ico"), default !important;
      }
      body #root a,
      body #root button,
      body #root .checkbox,
      body #root .checkbox *,
      body #root .cursorPointer {
        cursor: url("%PUBLIC_URL%/assets/cursor-pointer.ico"), pointer !important;
      }
      body.isLoading,
      body.isLoading #root * {
        cursor: url("%PUBLIC_URL%/assets/cursor-progress.ico"), progress !important;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
    <!-- Force Pacman player to use image -->
    <script>
      // This script will periodically check for pacman player elements and force them to use our image
      function enforcePacmanPlayerImage() {
        // Find all pacman-player elements
        const players = document.querySelectorAll('.pacman-player');
        
        players.forEach(player => {
          // Force background image
          player.style.backgroundImage = 'url("/assets/shaylaandme.png")';
          player.style.backgroundSize = 'contain';
          player.style.backgroundRepeat = 'no-repeat';
          player.style.backgroundPosition = 'center';
          player.style.zIndex = '999';
          
          // Make any child SVG elements invisible
          const svgElements = player.querySelectorAll('svg, path');
          svgElements.forEach(svg => {
            svg.style.display = 'none';
            svg.style.opacity = '0';
            svg.style.visibility = 'hidden';
          });
        });
        
        // Check again soon
        setTimeout(enforcePacmanPlayerImage, 100);
      }
      
      // Start the process after the page loads
      window.addEventListener('load', function() {
        enforcePacmanPlayerImage();
      });
    </script>
  </body>
</html>
